name: Build macOS app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app
        run: ./build_mac.sh
      - name: Zip app
        run: cd dist && ditto -c -k --keepParent "Cozy Roads.app" CozyRoads-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CozyRoads-macOS
          path: dist/CozyRoads-macOS.zip
